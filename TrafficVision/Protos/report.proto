syntax = "proto3";

option csharp_namespace = "VehicleAPI.Grpc";

// Serviço gRPC
service VehicleService {
  // Busca veículo pela placa
  rpc GetVehicleByPlate (VehicleByPlateRequest) returns (VehicleResponse);
}

// Requisição do cliente
message VehicleByPlateRequest {
  string plate = 1;
}

// Enum representando o estado do veículo
enum EnumDataVehicleCondition {
   Valid = 0;
   Old = 1;
   Unavailable = 2; 
}

enum EnumTypeFuelVehicle {
   Diesel = 0;
   Gasolina = 1;
   Gnv = 2;
   Eletrico = 3;
   Etanol = 4;
   Flex = 5;
}

enum EnumTheftVehicleCondition {
   Robbery = 0;
   Stolen = 1;
   None = 2;
}

// Resposta enviada pelo servidor
message VehicleResponse {
  string plate = 1;
  string brand = 2;
  string model = 3;
  int32 year = 4;
  string color = 5;
  string renavam = 6;
  string chassis = 7;
  string municipality = 8;
  string state = 9;
  EnumDataVehicleCondition vehicleCondition = 10;
  EnumTypeFuelVehicle fuelType = 11;
  EnumTheftVehicleCondition theftCondition = 12;
  bool wrecked = 13;
  bool judicialRestriction = 14;
  bool auction = 15;
  string ownerName = 16;
  string ownerCpfCnpj = 17;
  string ownerCnh = 18;
}
